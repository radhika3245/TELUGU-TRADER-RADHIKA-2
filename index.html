<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f0f0f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 15px;
  }
  .card {
    background: #ffffff;
    width: 100%;
    max-width: 360px;
    border-radius: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    padding: 28px 22px 22px;
    text-align: center;
  }
  .btn {
    display: block;
    width: 100%;
    background: linear-gradient(180deg, #ffd23f 0%, #f5a623 100%);
    color: #4a2e00;
    font-weight: 700;
    font-size: 15px;
    padding: 14px 10px;
    border-radius: 10px;
    border: none;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    box-shadow: 0 4px 10px rgba(245, 166, 35, 0.35);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .btn:hover {
    transform: translateY(-4px) scale(1.05);
    box-shadow: 0 10px 22px rgba(245, 166, 35, 0.6);
    background: linear-gradient(180deg, #ffe066 0%, #ffb02e 100%);
    animation: none;
  }
  .btn:active {
    transform: translateY(0) scale(0.97);
  }
  @keyframes pulse {
    0%, 100% {
      box-shadow: 0 4px 10px rgba(245, 166, 35, 0.35);
      transform: scale(1);
    }
    50% {
      box-shadow: 0 6px 20px rgba(245, 166, 35, 0.7);
      transform: scale(1.015);
    }
  }
  .photo-wrap {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 4px solid #ffcc33;
    margin: 26px auto 18px;
    overflow: hidden;
  }
  .photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .name {
    font-size: 19px;
    font-weight: 800;
    color: #f5a623;
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .feature {
    background: #fdf6d8;
    border-radius: 10px;
    padding: 13px 12px;
    font-size: 14px;
    font-weight: 600;
    color: #333;
    margin-bottom: 12px;
  }
  .join-bottom {
    margin-top: 8px;
    margin-bottom: 14px;
  }
  .counter {
    font-size: 15px;
    font-weight: 700;
    color: #222;
  }
